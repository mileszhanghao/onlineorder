name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Pre-pull PostgreSQL image for Testcontainers
        run: |
          echo "::notice::$(docker version --format 'client {{.Client.APIVersion}} / server {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}')"
          for img in postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine; do
            if out=$(docker pull "$img" 2>&1); then echo "::notice::pulled $img"; else echo "::warning::pull $img failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; fi
          done
      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners).
      - name: Build and test
        run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED|Caused by|Exception" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          out = root.findtext('system-out') or ''
          for line in out.splitlines():
              if any(k in line for k in ('ERROR', 'WARN', 'Docker', 'docker', 'API', 'pull')):
                  print('::warning::' + line[:600])
          for case in root.iter('testcase'):
              for kind in ('failure', 'error'):
                  node = case.find(kind)
                  if node is not None:
                      text = (node.get('message') or '') + ' ' + (node.text or '')[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::" + text.replace('\n', '%0A'))
          PY
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
