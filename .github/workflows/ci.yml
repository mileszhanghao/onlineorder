name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners).
      - name: Build and test
        run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          rows, totals = [], [0, 0, 0, 0]
          for f in sorted(glob.glob('build/test-results/test/*.xml')):
              r = ET.parse(f).getroot()
              n, fl, er, sk = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              totals = [a + b for a, b in zip(totals, (n, fl, er, sk))]
              rows.append(f"| {r.get('name').split('.')[-1]} | {n} | {fl + er} | {sk} |")
          summary = "| Test class | Tests | Failed | Skipped |\n|---|---|---|---|\n" + "\n".join(rows)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary + "\n")
          print(f"::notice::backend tests: {totals[0]} run, {totals[1] + totals[2]} failed, {totals[3]} skipped")
          PY
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E "error:|FAILED|Caused by|Exception" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.iter('testcase'):
              for kind in ('failure', 'error'):
                  node = case.find(kind)
                  if node is not None:
                      text = (node.get('message') or '') + ' ' + (node.text or '')[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::" + text.replace('\n', '%0A'))
          PY
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
